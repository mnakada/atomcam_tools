[global]
  workgroup = WORKGROUP
  map to guest = Bad User
  min protocol = SMB2
  unix extensions = no
  wide links = yes
  # SMB2 and later need no NetBIOS: run without nmbd and listen on 445 only
  disable netbios = yes
  smb ports = 445
  # no printers: no background print queue process and no printcap reload every minute
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  # CP850 is not built in; ASCII avoids a warning for each connection
  dos charset = ASCII
  # the log is on the RAM disk
  max log size = 100
  # each tdb takes about 420 KB even when nearly empty: keep them on the SD card,
  # not on the RAM disk (lock directory and private dir must stay there, because
  # samba refuses the 0777 directories of the FAT file system)
  state directory = /media/mmc/.samba
  cache directory = /media/mmc/.samba/cache
  passdb backend = tdbsam:/media/mmc/.samba/passdb.tdb

[record]
  comment = SD-Card
  path = /media/mmc/record
  public = yes
  writable = yes
  guest ok = yes

[time_lapse]
  comment = SD-Card
  path = /media/mmc/time_lapse
  public = yes
  writable = yes
  guest ok = yes

[alarm_record]
  comment = SD-Card
  path = /media/mmc/alarm_record
  public = yes
  writable = yes
  guest ok = yes

[update]
  comment = SD-Card
  path = /media/mmc/update
  public = yes
  writable = yes
  guest ok = yes
